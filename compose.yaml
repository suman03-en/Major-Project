services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_pass}
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-neo4j_pass} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag:
    build: .
    container_name: rag
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"
    volumes:
      - ./input_pdfs:/app/input_pdfs
      - ./extracted_jsons:/app/extracted_jsons
      - ./ner_outputs:/app/ner_outputs
      - ./datasets:/app/datasets
      - huggingface_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - RUN_EXTRACT=${RUN_EXTRACT:-false}
      - RUN_INGEST=${RUN_INGEST:-false}
      - RECREATE_COLLECTION=${RECREATE_COLLECTION:-false}
      - ENABLE_RERANK=${ENABLE_RERANK:-false}
      - RUN_GRAPH_INGEST=${RUN_GRAPH_INGEST:-false}
      - FORCE_OCR=${FORCE_OCR:-true}
      # Surya OCR VRAM tuning for RTX 3050 4 GB
      - RECOGNITION_BATCH_SIZE=2
      - DETECTOR_BATCH_SIZE=2
      - TORCH_CUDA_ALLOC_CONF=expandable_segments:True
    # ── GPU passthrough (requires NVIDIA Container Toolkit on the host) ─────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy

volumes:
  qdrant_storage:
  neo4j_data:
  huggingface_cache: