services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"

  rag:
    build: .
    container_name: rag
    stdin_open: true
    tty: true
    volumes:
      - ./input_pdfs:/app/input_pdfs
      - ./extracted_jsons:/app/extracted_jsons
      - ./ner_outputs:/app/ner_outputs
      - ./datasets:/app/datasets
      - huggingface_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - RUN_EXTRACT=${RUN_EXTRACT:-false}
      - RUN_INGEST=${RUN_INGEST:-false}
      - RECREATE_COLLECTION=${RECREATE_COLLECTION:-false}
      - ENABLE_RERANK=${ENABLE_RERANK:-false}
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
  huggingface_cache: