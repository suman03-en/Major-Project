services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_pass}
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-neo4j_pass} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag:
    build: .
    container_name: rag
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./input_pdfs:/app/input_pdfs
      - ./extracted_jsons:/app/extracted_jsons
      - ./ner_outputs:/app/ner_outputs
      - ./datasets:/app/datasets
      - ./data:/app/data
      - huggingface_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - ENABLE_RERANK=${ENABLE_RERANK:-false}
      - USE_GRAPH=${USE_GRAPH:-false}
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  ocr:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: ocr
    profiles: ["gpu"]
    stdin_open: true
    tty: true
    volumes:
      - ./input_pdfs:/app/input_pdfs
      - ./extracted_jsons:/app/extracted_jsons
      - ./ner_outputs:/app/ner_outputs
      - huggingface_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - RECOGNITION_BATCH_SIZE=2
      - DETECTOR_BATCH_SIZE=2
      - TORCH_CUDA_ALLOC_CONF=expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qdrant_storage:
  neo4j_data:
  huggingface_cache: